<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <!-- WXT reads entrypoint options from meta tags; this becomes
       options_ui.open_in_tab in the generated manifest. -->
  <meta name="manifest.open_in_tab" content="true" />
  <title>Remove bots: rules</title>
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0 auto;
      padding: 32px 24px 64px;
      max-width: 680px;
      background: #202124;
      color: #e8eaed;
      font: 14px/1.55 "Google Sans", Roboto, -apple-system, "Segoe UI", sans-serif;
    }
    h1 { font-size: 20px; font-weight: 500; margin: 0 0 4px; }
    h2 { font-size: 14px; font-weight: 500; margin: 28px 0 6px; }
    p { color: #9aa0a6; margin: 0 0 10px; }
    textarea {
      width: 100%;
      min-height: 110px;
      padding: 10px 12px;
      background: #292a2d;
      border: 1px solid #3c4043;
      border-radius: 8px;
      color: #e8eaed;
      font: 13px/1.5 "SF Mono", Menlo, Consolas, monospace;
      resize: vertical;
    }
    textarea:focus { outline: none; border-color: #8ab4f8; }
    label.row { display: flex; align-items: center; gap: 10px; margin: 14px 0; }
    .bar { display: flex; align-items: center; gap: 14px; margin-top: 20px; }
    button {
      background: #8ab4f8;
      border: 0;
      border-radius: 18px;
      color: #202124;
      cursor: pointer;
      font: inherit;
      font-weight: 500;
      padding: 8px 20px;
    }
    button:hover { background: #aecbfa; }
    .saved { color: #81c995; font-size: 13px; opacity: 0; transition: opacity 0.2s; }
    .saved.show { opacity: 1; }
    details { margin-top: 28px; border-top: 1px solid #3c4043; padding-top: 14px; }
    summary { cursor: pointer; color: #8ab4f8; }
    .vendors { columns: 3; column-gap: 20px; color: #9aa0a6; font-size: 12px; margin-top: 10px; }
    code { background: #292a2d; border-radius: 4px; padding: 1px 5px; font-size: 12px; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="./main.jsx"></script>
</body>
</html>
